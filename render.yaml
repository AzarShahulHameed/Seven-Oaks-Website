services:
  - type: web
    name: sevenoaks-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REVALIDATE_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_URL
        sync: false
      - key: SECRETS_ENCRYPTION_KEY
        generateValue: true
